<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HATESIDE</title>
    <link rel="stylesheet" href="static/css/login.css">
    
</head>

<body>
    <div class="login-form">

        <div class="rodacabeca">
            <h1>HATESIDE</h1>
            <h2>Login</h2>
        </div>

        <form id="loginForm" action="#" method="post" class="formlabel">
            <div>
                <label for="username">Username</label>
                <input class="form-control" type="text" id="username" name="username" placeholder="Username"
                    autocomplete="username" required>
            </div>

            <div>
                <label for="password">Password</label>
                <input class="form-control" type="password" id="password" name="password" placeholder="Password"
                    autocomplete="current-password" required>
            </div>
            <button type="submit" id="login">Login</button>
            <a href="#">Precisa de ajuda?</a>
            <p id="mensagem" style="color: #ff6b6b; margin: 0;"></p>
        </form>
    </div>

    <footer>
        &copy; 2026 HATESIDE. Todos os direitos reservados a loja de vestimentas HATESIDE.
    </footer>
    <script src="static/js/login.js"></script>
</body>

</html>
