<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HATESIDE | Login</title>
    <link rel="stylesheet" href="static/css/all.css">
    <link rel="stylesheet" href="static/css/login.css">
</head>
<body>
    <header class="topbar">
        <div class="brand">
            <img src="static/img/logo.png" alt="HATESIDE" class="logo">
            <div class="brand-text">
                <h3>Welcome to</h3>
                <h1>HATESIDE</h1>
            </div>
        </div>
    </header>
 
    <main class="login-form">
        <div class="rodacabeca">
            <img src="static/img/logo.png" alt="" class="logo-grande">
            <h2>Login</h2>
            <p>Acesse o painel da sua loja</p>
        </div>
 
        <form id="loginForm" action="#" method="post" class="formlabel" novalidate>
            <div class="campo">
                <label for="username">Usuário</label>
                <input class="form-control" type="text" id="username" name="username"
                    placeholder="Digite seu usuário" autocomplete="username" required>
            </div>
 
            <div class="campo">
                <label for="password">Senha</label>
                <div class="senha-wrap">
                    <input class="form-control" type="password" id="password" name="password"
                        placeholder="Digite sua senha" autocomplete="current-password" required>
                    <button type="button" id="toggleSenha" class="toggle" aria-label="Mostrar senha">Mostrar</button>
                </div>
            </div>
 
            <p id="mensagem" class="mensagem" role="alert"></p>
 
            <button type="submit" id="login" class="btn-login">Entrar</button>
            <a href="#" class="ajuda">Precisa de ajuda?</a>
        </form>
    </main>
 
    <footer>
        &copy; 2026 HATESIDE. Todos os direitos reservados a loja de vestimentas HATESIDE.
    </footer>
 
    <script src="static/js/login.js"></script>
</body>
</html>
